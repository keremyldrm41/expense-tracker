{% extends "base.html" %}

{% block title %}Edit Expense{% endblock %}

{% block content %}
    <div class="form-card">
        <h1>Edit Expense</h1>

        <form action="{{ url_for('edit_expense', id=expense['id']) }}" method="POST">
            <div class="form-group">
                <label for="amount">Amount (€):</label>
                <input type="number" id="amount" name="amount" step="0.01" required
                       value="{{ '%.2f'|format(expense['amount_cents'] / 100) }}">
            </div>

            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required
                       value="{{ expense['date'] }}">
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <input type="text" id="description" name="description" required
                       value="{{ expense['description'] }}">
            </div>

            <!-- Options come from CATEGORIES in app.py -->
            <div class="form-group">
                <label for="category">Category:</label>
                <select id="category" name="category" required>
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if expense['category'] == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">Save Changes</button>
        </form>

        <a href="{{ url_for('index') }}" class="back-link back-link--bottom">← Back to Expenses</a>
    </div>
{% endblock %}
