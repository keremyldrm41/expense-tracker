{% extends "base.html" %}

{% block title %}Add Expense{% endblock %}

{% block content %}
    <div class="form-card">
        <h1>Add New Expense</h1>

        <!-- Using url_for('add_expense') dynamically targets our Python function -->
        <form action="{{ url_for('add_expense') }}" method="POST">
            <!-- 1. Amount Input -->
            <div class="form-group">
                <label for="amount">Amount (€):</label>
                <input type="number" id="amount" name="amount" step="0.01" required placeholder="e.g. 4.20">
            </div>

            <!-- 2. Date Input -->
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <!-- 3. Description Input -->
            <div class="form-group">
                <label for="description">Description:</label>
                <input type="text" id="description" name="description" required placeholder="e.g. Morning Coffee">
            </div>

            <!-- 4. Category Dropdown - options come from CATEGORIES in app.py -->
            <div class="form-group">
                <label for="category">Category:</label>
                <select id="category" name="category" required>
                    {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">Save Expense</button>
        </form>

        <a href="{{ url_for('index') }}" class="back-link">← Back to Expenses</a>
    </div>
{% endblock %}
